<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NERO_PRINT</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  padding:18px;
  background:
    radial-gradient(circle at 20% 10%,#27283b 0,transparent 38%),
    radial-gradient(circle at 90% 90%,#171829 0,transparent 40%),
    #080910;
  color:#fff;
}
.card{
  width:100%;max-width:470px;min-height:600px;
  padding:34px 35px 38px;
  border:1px solid rgba(255,255,255,.20);
  border-radius:27px;
  background:linear-gradient(145deg,rgba(37,38,51,.94),rgba(22,23,33,.94));
  box-shadow:0 25px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);
  text-align:center;
  backdrop-filter:blur(15px);
}
.logo{
  width:105px;height:105px;margin:0 auto 16px;border-radius:27px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#fff,#cfcfcf);
  color:#111;font-size:17px;font-weight:900;line-height:1.05;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.title{font-size:26px;font-weight:800;letter-spacing:-.8px;margin-bottom:26px}
.links{display:flex;flex-direction:column;gap:11px}
.link{
  height:68px;border-radius:17px;color:#fff;text-decoration:none;
  display:flex;align-items:center;padding:0 18px;
  font-size:15px;font-weight:700;
  box-shadow:0 8px 18px rgba(0,0,0,.22);
  transition:transform .18s,filter .18s;
}
.link:hover{transform:translateY(-2px);filter:brightness(1.08)}
.icon{
  width:42px;height:42px;border-radius:13px;
  background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;
  font-size:21px;margin-right:15px;
}
.text{flex:1;text-align:center;margin-right:52px}
.phone{background:linear-gradient(100deg,#28c857,#35c95a)}
.telegram{background:linear-gradient(100deg,#168bd2,#31a9e7)}
.location{background:linear-gradient(100deg,#ff641d,#ffc21b)}
.order{background:linear-gradient(100deg,#6b42ff,#bd3cf0)}
.bottom{
  margin-top:25px;padding:16px 18px;border-radius:17px;
  background:rgba(47,47,61,.88);color:#aaa;
  font-size:14px;font-weight:600;
}
.bottom b{color:#fff}
.address{margin-top:15px;color:#888;font-size:12px;line-height:1.5}
@media(max-width:420px){
 .card{padding:28px 20px 30px;border-radius:24px}
 .title{font-size:23px}
 .link{height:63px}
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">NERO<br>PRINT</div>
  <div class="title">NERO_PRINT</div>

  <div class="links">
    <a class="link phone" href="tel:+998900974997">
      <span class="icon">☎</span><span class="text">Raqam</span>
    </a>

    <a class="link telegram" href="https://t.me/NER0_PRINT" target="_blank">
      <span class="icon">✈</span><span class="text">Telegram</span>
    </a>

    <a class="link location" href="https://maps.app.goo.gl/w2SqNNjYUEQgodit9" target="_blank">
      <span class="icon">📍</span><span class="text">Manzil</span>
    </a>

    <a class="link order" href="https://t.me/NER0_PRINT" target="_blank">
      <span class="icon">🛒</span><span class="text">Buyurtma berish</span>
    </a>
  </div>

  <div class="bottom">Powered by <b>NERO_PRINT</b></div>
  <div class="address">📍 Talabalar shaharchasi 65B<br>☎ +998 90 097 49 97</div>
</div>
</body>
</html>
